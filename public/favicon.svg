<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <defs>
    <linearGradient id="gold-grad-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#F5C747" />
      <stop offset="70%" stop-color="#C29623" />
      <stop offset="100%" stop-color="#8A6818" />
    </linearGradient>
  </defs>
  <!-- Background circle or rounded rect for premium feel -->
  <rect width="100" height="100" rx="22" fill="#002147" stroke="url(#gold-grad-fav)" stroke-width="2" />
  <g stroke="url(#gold-grad-fav)" stroke-width="12" fill="none" stroke-linecap="square">
    <!-- Vertical Bar -->
    <path d="M 50 15 L 50 85" />
    <!-- Horizontal Bar -->
    <path d="M 15 50 L 85 50" />
    <!-- Top Right Hook -->
    <path d="M 50 15 L 85 15" />
    <!-- Bottom Right Hook -->
    <path d="M 85 50 L 85 85" />
    <!-- Bottom Left Hook -->
    <path d="M 50 85 L 15 85" />
    <!-- Top Left Hook -->
    <path d="M 15 50 L 15 15" />
  </g>
  <!-- 4 dots -->
  <circle cx="32" cy="32" r="4.5" fill="url(#gold-grad-fav)" />
  <circle cx="68" cy="32" r="4.5" fill="url(#gold-grad-fav)" />
  <circle cx="32" cy="68" r="4.5" fill="url(#gold-grad-fav)" />
  <circle cx="68" cy="68" r="4.5" fill="url(#gold-grad-fav)" />
</svg>